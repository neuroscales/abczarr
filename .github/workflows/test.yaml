name: Run tests

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Commit / Branch / Tag / SHA to checkout
        required: false
        default: ""
      python-version:
        description: Python version
        required: true
        default: ""
      extra-constraints:
        description: Extra pip requirements installed after the package (e.g. a dependency floor)
        required: false
        default: ""
  workflow_call:
    inputs:
      tag:
        description: Commit / Branch / Tag / SHA to checkout
        required: false
        default: ""
        type: string
      python-version:
        description: Python version
        required: true
        default: ""
        type: string
      extra-constraints:
        description: Extra pip requirements installed after the package (e.g. a dependency floor)
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}
      - name: Setup Python ${{ inputs.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
          pip install pytest
          if [ -n "${{ inputs.extra-constraints }}" ]; then
            # Pin a dependency to its declared floor so drift is caught here,
            # not by a user on the oldest supported version.
            pip install ${{ inputs.extra-constraints }}
          fi
      - name: Test with pytest
        shell: bash
        run: pytest
